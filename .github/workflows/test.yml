name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # The hooks run on every platform Claude Code does, in both Bash and PowerShell
    # environments, so the suite runs on all three.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  versions:
    # An installed plugin is pinned to its version, so a change that doesn't raise it
    # never reaches anyone.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-version-bumps.mjs --base origin/${{ github.base_ref }}
